<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{mail/layout :: pagina(${nomePartecipante + ' si è iscritto a ' + nomeEvento}, ~{::contenuto})}">
<body>
<div th:fragment="contenuto">
  <p style="margin:0 0 12px; font-size:11px; font-weight:800; letter-spacing:0.2em; text-transform:uppercase; color:#67e8f9;">Nuova iscrizione</p>
  <h1 style="margin:0 0 16px; font-size:30px; line-height:1.15; font-weight:900; color:#ffffff;">Il tuo evento cresce.</h1>
  <p style="margin:0 0 24px;">Ciao <span th:text="${nomeProprietario}">Nome</span>, c'&egrave; un nuovo partecipante.</p>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
         style="border-radius:24px; background-color:#111827; border:1px solid #1e293b;">
    <tr>
      <td style="padding:20px 24px;">
        <p style="margin:0; font-size:16px; font-weight:800; color:#ffffff;" th:text="${nomePartecipante}">Partecipante</p>
        <p style="margin:2px 0 0; font-size:14px; color:#94a3b8;">si &egrave; iscritto a <strong style="color:#cffafe;" th:text="${nomeEvento}">Evento</strong></p>
      </td>
    </tr>
  </table>

  <p style="margin:24px 0 28px; font-size:13px; color:#94a3b8;">Trovi l'elenco completo dei partecipanti nella pagina dell'evento.</p>

  <a th:href="${urlApplicazione + '/dashboard'}"
     style="display:inline-block; border-radius:16px; background-color:#ffffff; padding:14px 24px; font-size:14px; font-weight:900; color:#020617; text-decoration:none;">Apri il cockpit</a>
</div>
</body>
</html>
