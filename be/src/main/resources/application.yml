spring:
  application:
    name: piattaforma-eventi

  datasource:
    # In locale valgono i valori dopo i due punti. Su Render DatabaseUrl legge
    # DATABASE_URL e sovrascrive queste tre proprieta'.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/BUILD-WEEK-5}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
      fail-on-null-for-primitives: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    # Account Gmail del progetto, uguale per tutti. La password resta fuori dal repo.
    username: ${MAIL_USERNAME:eventverse379@gmail.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        transport:
          protocol: smtp

server:
  # Render assegna la porta in PORT.
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGIN:http://localhost:5173,http://localhost:4173}
  mail:
    # Gmail spedisce solo a nome dell'account autenticato: mittente e username coincidono.
    mittente: ${MAIL_FROM:eventverse379@gmail.com}
    # Indirizzo del frontend, per i pulsanti nelle email (senza / finale).
    url-applicazione: ${APP_URL:http://localhost:5173}
    abilitato: ${MAIL_ABILITATO:true}
  ai:
    # Spenta di default: chi non ha la chiave OpenRouter avvia comunque il progetto.
    # Si accende con AI_ABILITATA=true (su Render e' in render.yaml).
    abilitata: ${AI_ABILITATA:false}
    modello: "${AI_MODELLO:nvidia/nemotron-3.5-lightning:free}"
    chiave: ${OPENROUTER_API_KEY:}
  geocoding:
    abilitato: ${GEOCODING_ABILITATO:true}
    chiave: ${GOOGLE_MAPS_API_KEY:}
  verifica:
    durata-codice-minuti: 15
  sicurezza:
    tentativi-massimi: ${LOGIN_TENTATIVI_MASSIMI:5}
    blocco-minuti: ${LOGIN_BLOCCO_MINUTI:15}
    jwt:
      # Default SOLO per sviluppo locale: su Render JWT_SECRET viene generato (render.yaml).
      segreto: ${JWT_SECRET:eventverse-chiave-di-sviluppo-locale-non-usare-in-produzione}
      scadenza-minuti: ${JWT_SCADENZA_MINUTI:120}
    # In produzione: ALLOWED_ORIGIN=https://<fe>.onrender.com (piu' valori separati da virgola).
    allowed-origins: ${ALLOWED_ORIGIN:http://localhost:5173,http://localhost:4173}
